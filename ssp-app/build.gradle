plugins {
    id 'application'
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.12'
    implementation 'com.zaxxer:HikariCP:7.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.0'
}

application {
    mainClass = 'com.bbororo.rtb.ssp.SspApplication'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'provider-config-replication'
        excludeTags 'ssp-claim-store'
    }
}

tasks.register('sspClaimStoreIntegrationTest', Test) {
    description = 'Runs the durable SSP billing claim store against a regional PostgreSQL database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'ssp-claim-store'
    }
}

tasks.register('providerConfigReplicationIntegrationTest', Test) {
    description = 'Runs the PostgreSQL provider configuration reader against the local publisher and subscriber databases.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'provider-config-replication'
    }

    systemProperty 'provider.config.publisher.jdbc-url',
            providers.gradleProperty('providerConfigPublisherJdbcUrl').getOrElse('jdbc:postgresql://localhost:15432/rtb')
    systemProperty 'provider.config.subscriber.jdbc-url',
            providers.gradleProperty('providerConfigSubscriberJdbcUrl').getOrElse('jdbc:postgresql://localhost:25432/rtb')
    systemProperty 'provider.config.username',
            providers.gradleProperty('providerConfigUsername').getOrElse('postgres')
    systemProperty 'provider.config.password',
            providers.gradleProperty('providerConfigPassword').getOrElse('local-dev-postgres-password')
}
