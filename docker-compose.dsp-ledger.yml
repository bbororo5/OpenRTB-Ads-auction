services:
  dsp-ledger-seoul:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rtb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-postgres-password
    ports:
      - "35432:5432"
    volumes:
      - ./infrastructure/postgres/dsp-regional-ledger/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rtb"]
      interval: 2s
      timeout: 2s
      retries: 15

  dsp-ledger-tokyo:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rtb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-postgres-password
    ports:
      - "45432:5432"
    volumes:
      - ./infrastructure/postgres/dsp-regional-ledger/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rtb"]
      interval: 2s
      timeout: 2s
      retries: 15
